[package]
name = "warden"
version = "0.2.0"
edition = "2021"
authors = ["Yanis"]
license = "MIT"
repository = "https://github.com/Pamacea/warden"
description = "AI-powered security review CLI tool for web applications. 100% Rust, zero dependencies."
readme = "README.md"
keywords = ["security", "pentest", "vulnerability-scanner", "owasp", "web-security"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.75"

[[bin]]
name = "warden"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
anyhow = "1.0"
thiserror = "2.0"

# Async runtime
tokio = { version = "1.42", features = ["full"] }
rayon = "1.10"

# HTTP client
reqwest = { version = "0.12", features = ["json", "cookies"] }
hyper = "1.5"
url = "2.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parsing
regex = "1.11"
walkdir = "2.5"

# UI/Colors
colored = "2.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File system
dirs = "5.0"

# Date/Time
chrono = "0.4"

# Encoding
urlencoding = "2.1"

# TOML parsing
toml = "0.8"

[dev-dependencies]
criterion = "0.5"
tokio-test = "0.4"
mockito = "1.6"
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3

[profile.dev]
opt-level = 0

[[bench]]
name = "scanners"
harness = false
